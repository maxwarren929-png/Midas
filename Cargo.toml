[workspace]
members = ["crates/midas-core", "crates/midas-cli"]
resolver = "2"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT"

[workspace.dependencies]
anyhow = "1"
bincode = "1.3"
blake3 = "1"
burn = { version = "0.18", default-features = false, features = ["ndarray", "std"] }
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
csv = "1"
polars = { version = "0.46", default-features = false, features = ["csv", "parquet", "dtype-date", "temporal"] }
proptest = "1"
rand = "0.8"
rand_chacha = { version = "0.3", features = ["serde1"] }
rand_distr = "0.4"
libm = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tempfile = "3"
thiserror = "2"
toml = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

[profile.release]
lto = "thin"
